<sc-if value="{{hasNew}}" hint-placeholder-val="{{false}}">

<span style="width: 22px; height: 22px; border-radius: 8px; border: 1.5px solid #3a3480"></span>

<div class="field">

<div class="field">

<sc-if value="{{hasDate}}" hint-placeholder-val="{{false}}"><span class="hint">Aparecerá en Agenda y en Inicio ese día.</span></sc-if>

<div style="display: flex; gap: 8px">

</div>
</div>
<div class="field">
<label class="lbl" for="t-notas">Notas</label>

</div>
</div>
<div style="display: flex; gap: 10px; padding: 16px 24px 20px; border-top: 1px solid #efe8dd">
<button class="pill pill-ghost" type="button" onClick="{{close}}">Cancelar</button>

</div>
</form>
</div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { open: true, title: 'Diseñar la rutina de Día a día', touched: false, focus: false, proj: 'dash', estado: 0, prio: 'Media', date: '2026-10-10', withTime: true, time: '17:00', subs: ['Bloques por horario', 'Avisos de vitaminas y agua'], newSub: '', created: '' };
  }

    var prios = ['Alta', 'Media', 'Baja'].map(function (n) { var on = st.prio === n; return { name: n, sel: on, pick: function () { self.setState({ prio: n }); }, style: 'background: ' + PS[n][0] + '; color: ' + PS[n][1] + '; ' + (on ? 'box-shadow: 0 0 0 2px #fffdf9, 0 0 0 4px #1f1c19;' : 'opacity: .7;') }; });
    var subs = st.subs.map(function (s, i) { return { t: s, del: 'Quitar subtarea: ' + s, remove: function () { var n = self.state.subs.slice(); n.splice(i, 1); self.setState({ subs: n }); } }; });
    var open = st.open;
    return {
      title: st.title, proj: st.proj, date: st.date, time: st.time, newSub: st.newSub, withTime: st.withTime, hasDate: !!st.date,
      titleCls: showErr ? 'inp bad' : 'inp', titleInvalid: showErr ? 'true' : 'false', showErr: showErr,
      setTitle: function (e) { self.setState({ title: val(e) }); },
      blurTitle: function () { self.setState({ touched: true, focus: false }); },
      focusTitle: function () { self.setState({ focus: true }); },

      setNewSub: function (e) { self.setState({ newSub: val(e) }); },
      subKey: function (e) { if (e.key === 'Enter') { e.preventDefault(); var v = self.state.newSub.trim(); if (v) self.setState({ subs: self.state.subs.concat([v]), newSub: '' }); } },
      states: states, prios: prios, subs: subs,
      rows: [{ t: 'Terminar el diseño del dashboard', d: 'Hoy' }, { t: 'Revisar la arquitectura del bot', d: 'Hoy' }, { t: 'Responder invitaciones pendientes', d: 'Hoy' }, { t: 'Propuesta de módulos', d: 'Vie 9' }, { t: 'Elegir stack y estructura de carpetas', d: 'Sáb 10' }],
      hasNew: !!st.created, newTitle: st.created,
      open: function () { self.setState({ open: true }); },
      close: function () { self.setState({ open: false }); },
      submit: function (e) { if (e && e.preventDefault) e.preventDefault(); if (!self.state.title.trim()) { self.setState({ touched: true, focus: false }); var el = document.getElementById('t-titulo'); if (el) el.focus(); return; } self.setState({ open: false, created: self.state.title.trim() }); },
      scrimOpacity: open ? '1' : '0', scrimEvents: open ? 'auto' : 'none',
      transform: open ? 'translateX(0)' : 'translateX(calc(100% + 24px))', vis: open ? 'visible' : 'hidden', hidden: open ? 'false' : 'true'
    };
  }
}
</script>
</body>
