<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0}
a{color:#1f1c19}a:hover{color:#4a443d}
.wrap{padding:26px 44px 56px;box-sizing:border-box}
@media (max-width:720px){.wrap{padding:14px 12px 40px}.topnav{order:3;width:100%}.hide-sm{display:none!important}}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:0;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;transition:transform .2s ease,background .2s ease,color .2s ease}
.pill-dark{background:#1f1c19;color:#f3eee6;box-shadow:0 10px 22px -8px rgba(31,28,25,.45)}
.pill-dark:hover{transform:translateY(-1px);color:#f3eee6}
.pill-ghost{background:transparent;border:1px solid #d8cfc2;color:#1f1c19}
.pill-ghost:hover{background:#f0eadf}
.pill-danger{background:#8c2f1b;color:#fffdf9}
.pill-danger:hover{transform:translateY(-1px);color:#fffdf9}
.navlink{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;text-decoration:none;white-space:nowrap;transition:background .2s ease}
.navlink:hover{background:rgba(31,28,25,.06)}
.icon{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:0;background:transparent;color:inherit;cursor:pointer;flex-shrink:0}
.icon:hover{background:rgba(31,28,25,.07)}
.h2i{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:12px;flex-shrink:0}
.card{background:#fffdf9;border:1px solid #e6ded2;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.lbl{font-weight:500;font-size:14px}
.inp{box-sizing:border-box;width:100%;min-height:48px;padding:0 14px;border-radius:14px;border:1px solid #d8cfc2;background:#fffdf9;font:inherit;color:#1f1c19;transition:border-color .2s ease}
.inp::placeholder{color:#8a8278}
.inp:focus{outline:2px solid #6a62d6;outline-offset:1px}
textarea.inp{padding:12px 14px;resize:vertical;line-height:1.55}
.inp.bad{border-color:#8c2f1b}
.hint{font-size:13px;color:#6b645b}
.err{font-size:13px;color:#8c2f1b;display:flex;align-items:center;gap:6px}
.seg{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .2s ease,color .2s ease}
.squig{stroke-dasharray:320;animation:draw .9s .2s ease-out both}
@keyframes draw{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
.pill:focus-visible,.navlink:focus-visible,.icon:focus-visible,.seg:focus-visible{outline:2px solid #6a62d6;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.squig{animation:none}.pill,.seg,.inp{transition:none}.pill:hover{transform:none}}
/*common*/
@media (max-width:720px){.topnav{position:fixed!important;left:10px;right:10px;bottom:10px;z-index:60;order:0!important;width:auto!important;justify-content:space-around!important;background:#fffdf9!important;box-shadow:0 18px 40px -16px rgba(31,28,25,.45);padding:6px!important;overflow:visible!important;border-radius:24px!important}.topnav .navlink{flex-direction:column;gap:2px;min-height:54px;padding:0 2px;flex:1;justify-content:center;border-radius:18px;font-size:11px;font-weight:500}.topnav .nx{display:none}.wrap{padding-bottom:116px!important}.toast{bottom:96px!important}}.topnav .nmore{display:none}@media (max-width:720px){.topnav .nmore{display:inline-flex}}@media (min-width:721px) and (max-width:1320px){.topnav .navlink{padding:0 10px;gap:6px}}.avlink:focus-visible{outline:2px solid #6a62d6;outline-offset:3px}@media (max-width:720px){.avlink{display:none!important}}.scrim{z-index:65}.drawer{z-index:70}
.chk{position:relative}.chk::after{content:"";position:absolute;inset:-10px}
.dotbtn{position:relative}.dotbtn::after{content:"";position:absolute;inset:-4px}
.bar{transition:none!important;transform-origin:left center;animation:barIn .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wbar{transition:none!important;transform-origin:bottom center;animation:wbarIn .6s cubic-bezier(.3,.7,.2,1) both}
@keyframes wbarIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar,.wbar{animation:none}}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:22px;background:#fffdf9;border:1px solid #e6ded2;text-decoration:none;color:#1f1c19;animation:tIn .35s cubic-bezier(.3,.7,.2,1) both}
.tile:focus-visible{outline:2px solid #6a62d6;outline-offset:2px}
@keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.mi{width:42px;height:42px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center}
.lrow{display:flex;align-items:center;gap:14px;min-height:56px;padding:0 4px;border-top:1px solid #f3ede3;text-decoration:none;color:#1f1c19}
.lrow:focus-visible{outline:2px solid #6a62d6}
@media (prefers-reduced-motion:reduce){.tile{animation:none}}
</style>
