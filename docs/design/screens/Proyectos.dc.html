<style>
body{margin:0}
a{color:#1f1c19}a:hover{color:#4a443d}
.wrap{padding:26px 44px 56px;box-sizing:border-box}
@media (max-width:720px){.wrap{padding:14px 12px 40px}.topnav{order:3;width:100%;overflow-x:auto}}
.pill{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 20px;border-radius:999px;border:0;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;transition:transform .2s ease,background .2s ease,color .2s ease}
.pill-dark{background:#1f1c19;color:#f3eee6;box-shadow:0 10px 22px -8px rgba(31,28,25,.45)}
.pill-dark:hover{transform:translateY(-1px);color:#f3eee6}
.navlink{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;text-decoration:none;white-space:nowrap;transition:background .2s ease}
.navlink:hover{background:rgba(31,28,25,.06)}
.fpill{all:unset;box-sizing:border-box;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;cursor:pointer;white-space:nowrap;transition:background .2s ease,color .2s ease}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;text-decoration:none;color:#1f1c19;background:#fffdf9;border:1px solid #e6ded2;border-radius:28px;overflow:hidden;transition:transform .25s cubic-bezier(.3,.7,.2,1),box-shadow .25s ease}
.pcard:hover{transform:translateY(-4px);box-shadow:0 26px 44px -30px rgba(31,28,25,.6);color:#1f1c19}
.cover{position:relative;height:172px;overflow:hidden}
.cover svg.art{position:absolute;inset:0;width:100%;height:100%;transition:transform .5s cubic-bezier(.3,.7,.2,1)}
.pcard:hover .cover svg.art{transform:scale(1.05)}
.a0{animation:pin0 .45s cubic-bezier(.3,.7,.2,1) both}.a1{animation:pin1 .45s cubic-bezier(.3,.7,.2,1) both}
@keyframes pin0{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pin1{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.squig{stroke-dasharray:320;animation:draw .9s .2s ease-out both}
@keyframes draw{from{stroke-dashoffset:320}to{stroke-dashoffset:0}}
.bar{transition:width .6s cubic-bezier(.3,.7,.2,1)}
.pill:focus-visible,.navlink:focus-visible,.fpill:focus-visible,.pcard:focus-visible{outline:2px solid #6a62d6;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.squig,.a0,.a1{animation:none}.pcard,.cover svg.art,.bar,.pill,.fpill{transition:none}.pcard:hover,.pcard:hover .cover svg.art{transform:none}}
/*common*/
@media (max-width:720px){.topnav{position:fixed!important;left:10px;right:10px;bottom:10px;z-index:60;order:0!important;width:auto!important;justify-content:space-around!important;background:#fffdf9!important;box-shadow:0 18px 40px -16px rgba(31,28,25,.45);padding:6px!important;overflow:visible!important;border-radius:24px!important}.topnav .navlink{flex-direction:column;gap:2px;min-height:54px;padding:0 2px;flex:1;justify-content:center;border-radius:18px;font-size:11px;font-weight:500}.topnav .nx{display:none}.wrap{padding-bottom:116px!important}.toast{bottom:96px!important}}.topnav .nmore{display:none}@media (max-width:720px){.topnav .nmore{display:inline-flex}}@media (min-width:721px) and (max-width:1320px){.topnav .navlink{padding:0 10px;gap:6px}}.avlink:focus-visible{outline:2px solid #6a62d6;outline-offset:3px}@media (max-width:720px){.avlink{display:none!important}}.scrim{z-index:65}.drawer{z-index:70}
.chk{position:relative}.chk::after{content:"";position:absolute;inset:-10px}
.dotbtn{position:relative}.dotbtn::after{content:"";position:absolute;inset:-4px}
.bar{transition:none!important;transform-origin:left center;animation:barIn .7s cubic-bezier(.3,.7,.2,1) both}
@keyframes barIn{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wbar{transition:none!important;transform-origin:bottom center;animation:wbarIn .6s cubic-bezier(.3,.7,.2,1) both}
@keyframes wbarIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.bar,.wbar{animation:none}}
</style>

      { k: 'dash', name: 'Dashboard personal', type: 'Personal', desc: 'Un solo lugar para mis tareas, proyectos, agenda, dinero y escritos.', done: 2, total: 7, next: 'Hoy', bg: '#e9e7fb' },
      { k: 'bot', name: 'Bot de marketing', type: 'Trabajo', desc: 'Reestructurar la arquitectura para que sirva de base a los siguientes bots.', done: 1, total: 4, next: 'Hoy', bg: '#1f1c19' },
      { k: 'vin', name: 'VinculaPSI', type: 'Trabajo', desc: 'Plataforma que conecta profesionales de salud mental con pacientes; invitaciones con n8n.', done: 3, total: 5, next: 'Hoy', bg: '#fffdf9' },
      { k: 'pel', name: 'Juego de peluches', type: 'Personal', desc: 'Juego cooperativo de peluches defectuosos con mi equipo de cuatro.', done: 1, total: 6, next: '12 oct', bg: '#f3e3c3' },
      { k: 'd67', name: '67downloader', type: 'Personal', desc: 'Página todo en uno para descargar videos de redes.', done: 4, total: 6, next: 'Vie 9', bg: '#f7f2ea' },
      { k: 'web', name: 'Web para foráneos', type: 'Personal', desc: 'Web automatizada enfocada en alimentación para quienes viven fuera de casa.', done: 0, total: 3, next: 'Sin fecha', bg: '#cbc6f5', paused: true },
      { k: 'ing', name: 'Ingeniería o maestría', type: 'Escuela', desc: 'Preparar la inscripción para enero; lo que llegue primero.', done: 0, total: 3, next: '14 oct', bg: '#f0eadf' }
    ];
    var typeStyle = function (t) {
      return 'display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; ' +
        (t === 'Trabajo' ? 'background: #f3eee6; color: #1f1c19; border: 1.5px solid #1f1c19;' : t === 'Escuela' ? 'background: #cbc6f5; color: #1f1c19; border: 1.5px solid #1f1c19;' : 'background: #1f1c19; color: #f3eee6;');
    };
    var sel = this.state.type, tk = this.state.tick;
    var shown = PR.filter(function (p) { return sel === 'all' || p.type === sel; });
    var cards = shown.map(function (p, i) {
      return {
        name: p.name, desc: p.desc, type: p.type, bg: p.bg, paused: !!p.paused,
        isDash: p.k === 'dash', isBot: p.k === 'bot', isVin: p.k === 'vin', isPel: p.k === 'pel', isD67: p.k === 'd67', isWeb: p.k === 'web', isIng: p.k === 'ing',
        pct: Math.round(p.done / p.total * 100) + '%',
        tasks: p.done + ' de ' + p.total + ' tareas',
        next: p.next === 'Sin fecha' ? 'Sin fecha' : 'Próxima: ' + p.next,
        aria: 'Abrir ' + p.name,
        cls: 'pcard a' + tk,
        style: 'animation-delay: ' + (i * 45) + 'ms;',
        typeStyle: typeStyle(p.type)
      };
    });
    var types = [['all', 'Todos'], ['Trabajo', 'Trabajo'], ['Personal', 'Personal'], ['Escuela', 'Escuela']].map(function (t) {
      var on = sel === t[0];
      return {
        name: t[1], sel: on, count: String(PR.filter(function (p) { return t[0] === 'all' || p.type === t[0]; }).length),
        pick: function () { self.setState({ type: t[0], tick: (self.state.tick + 1) % 2 }); },
        style: on ? 'background: #1f1c19; color: #f3eee6;' : 'color: #1f1c19;'
      };
    });
    var active = PR.filter(function (p) { return !p.paused; }).length;
    return { cards: cards, types: types, summary: PR.length + ' proyectos, ' + active + ' activos y 1 en pausa.' };
  }
}
